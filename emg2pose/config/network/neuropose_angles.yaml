# @package _global_
# NeuroPose configured to match Liu 2021 on MindRove hardware:
#   - 8-channel EMG only (no IMU — paper is explicit: EMG-only input)
#   - 1000-sample window @ 500Hz = 2s
#       (paper uses 5s @ 200Hz = 1000 samples; same sample count, half the
#       physical duration. If you want to match paper duration exactly, bump
#       window to 2500 here and in the training loop.)
#   - 20-angle output (wrapped by src/neuropose_angles.NeuroPoseAngles to
#     produce bounded, anatomy-respecting angles in radians).
#
# Channel-axis flow (time, channels):
#   Input (B, 1, 1000, 8)
#     enc [4, 2]  -> ( 250, 4)
#     enc [5, 2]  -> (  50, 2)
#     enc [5, 2]  -> (  10, 1)
#   (residuals, shape-preserving)
#     dec [5, 2]  -> (  50, 2)
#     dec [5, 4]  -> ( 250, 8)
#     dec [4, 2]  -> (1000, 16)
#   Flatten channels -> Linear(16 -> 20)  -> (B, 20, 1000)
#
# Dropout intentionally matches paper (0.05); we rely on bReLU + smoothness loss
# for regularization, not heavy dropout.

dropout_rate: .05

network:
  _target_: emg2pose.networks.NeuroPose

  linear_in_channels: 16
  out_channels: 20

  encoder_blocks:
  - _target_: emg2pose.networks.EncoderBlock
    in_channels: 1
    out_channels: 32
    kernel_size: [3, 2]
    max_pool_size: [4, 2]   # T: 1000 -> 250, C: 8 -> 4
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.EncoderBlock
    in_channels: 32
    out_channels: 128
    kernel_size: [3, 2]
    max_pool_size: [5, 2]   # T: 250 -> 50, C: 4 -> 2
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.EncoderBlock
    in_channels: 128
    out_channels: 256
    kernel_size: [3, 2]
    max_pool_size: [5, 2]   # T: 50 -> 10, C: 2 -> 1
    dropout_rate: ${dropout_rate}

  residual_blocks:
  - _target_: emg2pose.networks.ResidualBlock
    in_channels: 256
    out_channels: 256
    kernel_size: [3, 2]
    num_convs: 3
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.ResidualBlock
    in_channels: 256
    out_channels: 256
    kernel_size: [3, 2]
    num_convs: 3
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.ResidualBlock
    in_channels: 256
    out_channels: 256
    kernel_size: [3, 2]
    num_convs: 3
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.ResidualBlock
    in_channels: 256
    out_channels: 256
    kernel_size: [3, 2]
    num_convs: 3
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.ResidualBlock
    in_channels: 256
    out_channels: 256
    kernel_size: [3, 2]
    num_convs: 3
    dropout_rate: ${dropout_rate}

  decoder_blocks:
  - _target_: emg2pose.networks.DecoderBlock
    in_channels: 256
    out_channels: 128
    kernel_size: [3, 2]
    upsampling: [5, 2]   # T: 10 -> 50, C: 1 -> 2
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.DecoderBlock
    in_channels: 128
    out_channels: 32
    kernel_size: [3, 2]
    upsampling: [5, 4]   # T: 50 -> 250, C: 2 -> 8
    dropout_rate: ${dropout_rate}
  - _target_: emg2pose.networks.DecoderBlock
    in_channels: 32
    out_channels: 1
    kernel_size: [3, 2]
    upsampling: [4, 2]   # T: 250 -> 1000, C: 8 -> 16
    dropout_rate: ${dropout_rate}
